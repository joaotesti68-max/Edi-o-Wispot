<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Riscos na rede</title>
<link rel="stylesheet" href="common.css">
<style>
  #doorWrap { left: 350px; top: 760px; width: 380px; height: 600px; perspective: 1600px; }
  .frame {
    position: absolute; inset: 0; border: 6px solid var(--gray); border-bottom: none;
    border-radius: 22px 22px 0 0; background: #ffffff; overflow: hidden;
  }
  #glow { position: absolute; inset: 0; background: var(--grad); opacity: 0; }
  #panel {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #ffffff;
    border-right: 6px solid var(--gray); transform-origin: left center;
  }
  #panel .inset { position: absolute; left: 44px; right: 44px; border: 4px solid var(--line); border-radius: 12px; }
  #panel .knob { position: absolute; right: 36px; top: 300px; width: 22px; height: 22px; border-radius: 50%; background: var(--gray); }
  .floor { left: 250px; top: 1360px; width: 580px; height: 6px; border-radius: 3px; background: var(--gray); }
  .dot { position: absolute; left: 540px; top: 1080px; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--white); border: 4px solid var(--blue); opacity: 0; }
  #doorLabel { left: 90px; right: 90px; top: 1440px; text-align: center; font-weight: 800; font-size: 46px; color: var(--blue); }
  #doorLabel span { display: block; width: 120px; height: 4px; border-radius: 2px; background: var(--blue); margin: 22px auto 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div>

  <div class="head" id="head1" style="top: 380px;">
    <div class="overline">ATENÇÃO</div>
    <div class="title">Riscos comuns<br>na rede Wi-Fi</div>
  </div>

  <div id="rows">
    <div class="row" id="r1" style="top: 700px;">
      <div class="ico"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="7" width="19" height="10" rx="2.5"/><circle cx="7.5" cy="12" r="1" fill="#3696cd"/><circle cx="12" cy="12" r="1" fill="#3696cd"/><circle cx="16.5" cy="12" r="1" fill="#3696cd"/></svg></div>
      <div class="txt"><div class="name">Senhas fracas</div><div class="sub">Fáceis de adivinhar</div></div>
      <div class="mark" style="background: var(--gray);"><svg width="30" height="30" viewBox="0 0 24 24"><rect x="10.8" y="4" width="2.4" height="10.5" rx="1.2" fill="#ffffff"/><circle cx="12" cy="19" r="1.6" fill="#ffffff"/></svg></div>
    </div>
    <div class="row" id="r2" style="top: 886px;">
      <div class="ico"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="11" width="15" height="10" rx="2.2"/><path id="shackle" d="M8 11 V7.5 A4 4 0 0 1 16 7.5 V8.5"/><circle cx="12" cy="16" r="1.2" fill="#3696cd"/></svg></div>
      <div class="txt"><div class="name">Redes abertas</div><div class="sub">Qualquer um conecta</div></div>
      <div class="mark" style="background: var(--gray);"><svg width="30" height="30" viewBox="0 0 24 24"><rect x="10.8" y="4" width="2.4" height="10.5" rx="1.2" fill="#ffffff"/><circle cx="12" cy="19" r="1.6" fill="#ffffff"/></svg></div>
    </div>
    <div class="row" id="r3" style="top: 1072px;">
      <div class="ico"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M10.9 7 L6.1 16 M13.1 7 L17.9 16 M7.2 18 H16.8"/></svg></div>
      <div class="txt"><div class="name">Sem segmentação</div><div class="sub">Tudo na mesma rede</div></div>
      <div class="mark" style="background: var(--gray);"><svg width="30" height="30" viewBox="0 0 24 24"><rect x="10.8" y="4" width="2.4" height="10.5" rx="1.2" fill="#ffffff"/><circle cx="12" cy="19" r="1.6" fill="#ffffff"/></svg></div>
    </div>
    <div class="row" id="r4" style="top: 1258px;">
      <div class="ico"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="13" height="9" rx="1.5"/><path d="M1 17 H17"/><rect x="17" y="8" width="6" height="11" rx="1.5"/></svg></div>
      <div class="txt"><div class="name">Dispositivos sem controle</div><div class="sub">Ninguém sabe quem está conectado</div></div>
      <div class="mark" style="background: var(--gray);"><svg width="30" height="30" viewBox="0 0 24 24"><rect x="10.8" y="4" width="2.4" height="10.5" rx="1.2" fill="#ffffff"/><circle cx="12" cy="19" r="1.6" fill="#ffffff"/></svg></div>
    </div>
  </div>

  <div class="head" id="head2" style="top: 380px;">
    <div class="overline">O RESULTADO</div>
    <div class="title">A rede vira uma<br>porta aberta</div>
  </div>

  <div class="abs" id="doorWrap">
    <div class="frame">
      <div id="glow"></div>
      <div id="panel">
        <div class="inset" style="top: 46px; height: 200px;"></div>
        <div class="inset" style="top: 290px; height: 260px;"></div>
        <div class="knob"></div>
      </div>
    </div>
  </div>
  <div class="abs floor" id="floor"></div>
  <div id="dots"></div>

  <div class="abs" id="doorLabel">Para qualquer tipo de invasão<span></span></div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  const D = 9.8;
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
  const rise = (sel, at, dur = 0.7) => tl.fromTo(sel, { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: dur }, at);

  rise("#head1", 0);
  rise("#r1", 0.15);
  rise("#r2", 0.75);
  tl.to("#shackle", { attr: { d: "M8 11 V7.5 A4 4 0 0 1 16 7.5 V6" }, y: -2, duration: 0.5 }, 1.2);
  rise("#r3", 1.75);
  rise("#r4", 3.55);
  ["#r1", "#r2", "#r3", "#r4"].forEach((r, i) => {
    tl.fromTo(`${r} .mark`, { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.5 }, [0.45, 1.1, 2.4, 4.8][i]);
  });

  // "transformam a rede em uma porta aberta" (5.46)
  tl.to(["#head1", "#rows"], { autoAlpha: 0, y: -40, duration: 0.5, ease: "power2.in" }, 5.3);
  rise("#head2", 5.8);
  tl.fromTo("#doorWrap", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.8 }, 5.95);
  tl.fromTo("#floor", { scaleX: 0 }, { scaleX: 1, duration: 0.8 }, 6.0);

  // door opens (7.26)
  tl.to("#panel", { rotationY: -72, duration: 1.1, ease: "power2.inOut" }, 7.1);
  tl.to("#glow", { opacity: 1, duration: 0.8 }, 7.4);

  // "qualquer tipo de invasão" (8.31): small dots drift out of the doorway
  const rand = seeded(4);
  const dots = document.getElementById("dots");
  for (let i = 0; i < 14; i++) {
    const d = document.createElement("div");
    d.className = "dot";
    dots.appendChild(d);
    const at = 7.9 + i * 0.1;
    const x = (rand() - 0.5) * 760;
    const y = (rand() - 0.5) * 520;
    tl.fromTo(d, { x: (rand() - 0.5) * 120, y: (rand() - 0.5) * 300, opacity: 0, scale: 0.5 },
      { x, y, opacity: 0.85, scale: 1, duration: 1.4, ease: "power2.out" }, at);
  }
  rise("#doorLabel", 8.3);
  tl.fromTo("#doorLabel span", { scaleX: 0 }, { scaleX: 1, duration: 0.7 }, 8.7);

  tl.set({}, {}, D);
  mountTimeline(tl);
</script>
</body>
</html>
