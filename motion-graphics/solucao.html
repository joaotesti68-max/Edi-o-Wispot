<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rede bem estruturada</title>
<link rel="stylesheet" href="common.css">
<style>
  #router {
    left: 460px; top: 660px; width: 160px; height: 160px; border-radius: 50%;
    background: #ffffff; border: 2px solid var(--line); box-shadow: 0 18px 44px rgba(28,63,87,0.10);
    display: flex; align-items: center; justify-content: center;
  }
  .ripple { position: absolute; left: 540px; top: 740px; width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; border: 3px solid var(--blue); opacity: 0; }
  .group {
    position: absolute; top: 960px; width: 270px; height: 290px; border-radius: 28px;
    background: #ffffff; border: 2px solid var(--line); box-shadow: 0 18px 44px rgba(28,63,87,0.08);
  }
  .group .gname {
    position: absolute; left: 0; right: 0; top: 26px; text-align: center;
    font-weight: 800; font-size: 34px; color: var(--navy);
  }
  .group .gbar { position: absolute; left: 105px; width: 60px; top: 78px; height: 4px; border-radius: 2px; background: var(--blue); }
  .group .devs { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; gap: 22px; }
  .dev { width: 84px; height: 84px; border-radius: 22px; background: var(--blue-soft); display: flex; align-items: center; justify-content: center; }
  #monitor {
    left: 50%; top: 1330px; transform: translateX(-50%); white-space: nowrap;
    display: flex; align-items: center; gap: 18px; padding: 20px 36px; border-radius: 999px;
    background: #ffffff; border: 2px solid var(--line); box-shadow: 0 18px 44px rgba(28,63,87,0.08);
    font-weight: 800; font-size: 34px;
  }
  #liveDot { width: 20px; height: 20px; border-radius: 50%; background: var(--blue); }
  .q { display: inline-block; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div>

  <div class="head" id="head1" style="top: 380px;">
    <div class="overline">A SOLUÇÃO</div>
    <div class="title">Rede bem<br>estruturada</div>
  </div>

  <div id="diagram">
    <svg class="abs" style="left:0; top:0;" width="1080" height="1920">
      <g fill="none" stroke="#3696cd" stroke-width="4" stroke-linecap="round">
        <path class="link" d="M540 820 V880 H225 V960"/>
        <path class="link" d="M540 820 V960"/>
        <path class="link" d="M540 820 V880 H855 V960"/>
      </g>
      <g id="packets"></g>
    </svg>
    <div class="ripple"></div><div class="ripple"></div>
    <div class="abs" id="router">
      <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#1c3f57" stroke-width="1.6" stroke-linecap="round"><path d="M5 10.5 A9.5 9.5 0 0 1 19 10.5"/><path d="M8 13 A5.5 5.5 0 0 1 16 13"/><rect x="3.5" y="15.5" width="17" height="5" rx="1.6"/><circle cx="7.5" cy="18" r="0.8" fill="#3696cd" stroke="none"/><circle cx="10.5" cy="18" r="0.8" fill="#3696cd" stroke="none"/></svg>
    </div>

    <div class="group" id="g1" style="left: 90px;">
      <div class="gname">Equipe</div><div class="gbar"></div>
      <div class="devs">
        <div class="dev"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19 H22"/></svg></div>
        <div class="dev"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18 H13"/></svg></div>
      </div>
    </div>
    <div class="group" id="g2" style="left: 405px;">
      <div class="gname">Visitantes</div><div class="gbar"></div>
      <div class="devs">
        <div class="dev"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18 H13"/></svg></div>
        <div class="dev"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18 H13"/></svg></div>
      </div>
    </div>
    <div class="group" id="g3" style="left: 720px;">
      <div class="gname">IoT</div><div class="gbar"></div>
      <div class="devs">
        <div class="dev"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="7" width="18" height="11" rx="2.5"/><circle cx="12" cy="12.5" r="3"/></svg></div>
        <div class="dev"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 9 H16 M8 13 H13"/></svg></div>
      </div>
    </div>

    <div class="abs" id="monitor"><div id="liveDot"></div>Monitoramento ativo</div>
  </div>

  <div class="head" id="head2" style="top: 380px;">
    <div class="overline">O QUE A EMPRESA GANHA</div>
    <div class="title">Mais segurança<br>no dia a dia</div>
  </div>

  <div class="row" id="b1" style="top: 700px;">
    <div class="ico"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12 H7 L9.5 7 L13.5 17 L16 12 H22"/></svg></div>
    <div class="txt"><div class="name">Estabilidade</div><div class="sub">Conexão sem quedas</div></div>
    <div class="mark" style="background: var(--blue);"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12.5 L10 17 L19 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
  <div class="row" id="b2" style="top: 886px;">
    <div class="ico"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 L9.5 10.5 L13.5 14.5 L21 7"/><path d="M15 7 H21 V13"/></svg></div>
    <div class="txt"><div class="name">Capacidade de crescer</div><div class="sub">Rede pronta para expandir</div></div>
    <div class="mark" style="background: var(--blue);"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12.5 L10 17 L19 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
  <div class="row" id="b3" style="top: 1072px;">
    <div class="ico"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#3696cd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 L4.5 5.5 V11 C4.5 16 7.8 20 12 21.5 C16.2 20 19.5 16 19.5 11 V5.5 Z"/><path d="M8.5 12 L11 14.5 L15.5 9.5"/></svg></div>
    <div class="txt"><div class="name">Controle real</div><div class="sub"><span class="q" id="q1">Quem acessa</span> <span class="q" id="q2">e o quê</span></div></div>
    <div class="mark" style="background: var(--blue);"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12.5 L10 17 L19 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="common.js"></script>
<script>
  const D = 10.0;
  const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
  const rise = (sel, at, dur = 0.7) => tl.fromTo(sel, { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: dur }, at);

  // "Com uma rede sem fio bem estruturada" (0.15 – 1.49)
  rise("#head1", 0);
  tl.fromTo("#router", { autoAlpha: 0, scale: 0.85 }, { autoAlpha: 1, scale: 1, duration: 0.7 }, 0.3);
  gsap.utils.toArray(".ripple").forEach((r, i) => {
    tl.fromTo(r, { scale: 1, opacity: 0.5 }, { scale: 1.8, opacity: 0, duration: 2, ease: "power1.out", repeat: 1 }, 0.8 + i * 1);
  });
  gsap.utils.toArray(".link").forEach((ln, i) => {
    const len = ln.getTotalLength();
    tl.fromTo(ln, { attr: { "stroke-dasharray": len, "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.inOut" }, 1.1 + i * 0.1);
  });
  tl.fromTo(".dev", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.6, stagger: 0.08 }, 0.9);

  // "segmentada" (2.29): the groups take shape around the devices
  tl.fromTo(".group", { borderColor: "rgba(221,229,236,0)", backgroundColor: "rgba(255,255,255,0)", boxShadow: "0 18px 44px rgba(28,63,87,0)" },
    { borderColor: "#dde5ec", backgroundColor: "#ffffff", boxShadow: "0 18px 44px rgba(28,63,87,0.08)", duration: 0.7, stagger: 0.12 }, 2.2);
  tl.fromTo(".group .gname", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.6, stagger: 0.12 }, 2.3);
  tl.fromTo(".group .gbar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, stagger: 0.12 }, 2.45);

  // "monitorada" (3.01)
  rise("#monitor", 2.95);
  tl.to("#liveDot", { opacity: 0.25, duration: 0.45, repeat: 3, yoyo: true, ease: "sine.inOut" }, 3.3);
  const packets = document.getElementById("packets");
  const routes = [[[540, 820], [540, 880], [225, 880], [225, 960]], [[540, 820], [540, 960]], [[540, 820], [540, 880], [855, 880], [855, 960]]];
  routes.forEach((pts, i) => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("r", "9"); c.setAttribute("fill", "#1c3f57"); c.setAttribute("opacity", "0");
    c.setAttribute("cx", pts[0][0]); c.setAttribute("cy", pts[0][1]);
    packets.appendChild(c);
    const at = 3.15 + i * 0.12;
    tl.set(c, { attr: { opacity: 1 } }, at);
    const seg = 0.6 / (pts.length - 1);
    pts.slice(1).forEach((p, k) => tl.to(c, { attr: { cx: p[0], cy: p[1] }, duration: seg, ease: "none" }, at + k * seg));
    tl.set(c, { attr: { opacity: 0 } }, at + 0.6);
  });

  // "a empresa ganha" (≈4.1): switch to the benefits list
  tl.to(["#head1", "#diagram"], { autoAlpha: 0, y: -40, duration: 0.5, ease: "power2.in" }, 4.0);
  rise("#head2", 4.4);
  rise("#b1", 4.8);
  rise("#b2", 6.05);
  rise("#b3", 7.35);
  ["#b1", "#b2", "#b3"].forEach((b, i) => {
    tl.fromTo(`${b} .mark`, { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.5 }, [5.2, 6.9, 9.5][i]);
  });
  tl.fromTo("#q1", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 8.3);
  tl.fromTo("#q2", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 9.15);

  tl.set({}, {}, D);
  mountTimeline(tl);
</script>
</body>
</html>
