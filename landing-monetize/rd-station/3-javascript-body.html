<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
/* Wispot LP · "Monetize seu Wi-Fi"
   Needs (in this order, before this file):
   https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js
   https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js
   https://unpkg.com/lenis@1.1.13/dist/lenis.min.js
   Without them the page still works, just without motion. */
(function(){
  /* ---------- RD Station settings ---------- */
  const RD={
    publicToken:'94ef559c92f7b1764c0d7755f063425a',           // token público (o mesmo do formulário atual)
    conversion:'monetize-seu-wi-fi',                          // identificador da conversão
    thanks:'https://material.wispot.com.br/obrigado?event=leadMonetizeSeuWifi',
    liveHosts:['wispot.com.br','rdstation.com','lp.rdstation.com.br'] // só envia leads quando a página está publicada
  };

  const page=document.getElementById('wsp');if(!page)return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const HAS=!!(window.gsap&&window.ScrollTrigger);

  /* ---------- form → RD Station conversion ---------- */
  (function(){
    const form=document.getElementById('wsp-lead');if(!form)return;
    const msg=form.querySelector('.form-msg'),btn=form.querySelector('button[type=submit]');
    const live=RD.liveHosts.some(h=>location.hostname===h||location.hostname.endsWith('.'+h));
    const freeMail=/@(gmail|hotmail|outlook|yahoo|bol|uol|live|icloud)\./i;
    function say(t,cls){msg.className='form-msg'+(cls?' '+cls:'');msg.textContent=t}
    function utm(k){try{return new URLSearchParams(location.search).get(k)||undefined}catch(e){return undefined}}
    function trackId(){try{const m=document.cookie.match(/(?:^|; )rdtrk=([^;]+)/);return m?JSON.parse(decodeURIComponent(m[1])).id:undefined}catch(e){return undefined}}
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      form.querySelectorAll('.field').forEach(f=>f.classList.remove('err'));
      if(form.website.value)return; // bot
      const req=[...form.querySelectorAll('[required]')];
      const miss=req.find(el=>!el.value.trim());
      if(miss){miss.closest('.field').classList.add('err');say('Preencha todos os campos marcados com *.','bad');miss.focus();return}
      const email=form.email.value.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){form.email.closest('.field').classList.add('err');say('Confira o e-mail: falta o @ ou o domínio.','bad');form.email.focus();return}
      if(freeMail.test(email)){form.email.closest('.field').classList.add('err');say('Use o e-mail da sua empresa, não um e-mail pessoal.','bad');form.email.focus();return}
      if(!live){say('Prévia: tudo certo com o preenchimento. Na página publicada no RD Station, o lead é enviado e a pessoa vai para a página de obrigado.','ok');return}
      btn.disabled=true;say('Enviando…');
      const payload={conversion_identifier:RD.conversion,email,company_name:form.company.value.trim(),
        cf_numero_de_funcionarios:form.cf_numero_de_funcionarios.value,cf_segmento_da_empresa:form.cf_segmento_da_empresa.value,
        traffic_source:utm('utm_source'),traffic_medium:utm('utm_medium'),traffic_campaign:utm('utm_campaign'),traffic_value:utm('utm_term'),
        client_tracking_id:trackId()};
      try{
        const r=await fetch('https://api.rd.services/platform/conversions?api_key='+RD.publicToken,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_type:'CONVERSION',event_family:'CDP',payload})});
        if(!r.ok)throw new Error(r.status);
        say('Recebemos seus dados. Redirecionando…','ok');
        location.href=RD.thanks;
      }catch(err){
        btn.disabled=false;say('Não conseguimos enviar agora. Tente de novo em alguns segundos.','bad');
      }
    });
  })();

  /* ---------- signal waves behind the form ---------- */
  document.querySelectorAll('.wsp canvas.signal').forEach(c=>{
    const x=c.getContext('2d');let w,h;
    function size(){const d=Math.min(2,devicePixelRatio||1),r=c.getBoundingClientRect();w=r.width;h=r.height;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}
    size();addEventListener('resize',size);
    function draw(t){x.clearRect(0,0,w,h);const cx=w/2,cy=h*1.04,max=Math.hypot(w,h),gap=54,ph=(t/40)%gap;
      for(let r=ph;r<max;r+=gap){const a=Math.max(0,1-r/max);x.beginPath();x.arc(cx,cy,r,Math.PI*1.08,Math.PI*1.92);x.strokeStyle=`rgba(255,255,255,${.3*a})`;x.lineWidth=1.4;x.lineCap='round';x.stroke()}
      if(!reduce)requestAnimationFrame(draw)}
    requestAnimationFrame(draw);
  });

  /* ---------- client logos: hide broken images ---------- */
  document.querySelectorAll('#wsp-clients img').forEach(img=>{
    const swap=()=>{const d=document.createElement('div');d.className='ph';d.textContent='Logo cliente';img.replaceWith(d)};
    if(img.complete&&!img.naturalWidth)swap();else img.addEventListener('error',swap);
  });

  if(!HAS||reduce){page.classList.add('no-motion');return}

  /* ================= motion ================= */
  gsap.registerPlugin(ScrollTrigger);
  const EO='expo.out',clamp=gsap.utils.clamp;
  const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;

  let lenis=null;
  if(window.Lenis){lenis=new Lenis({duration:1.3,wheelMultiplier:.85});lenis.on('scroll',ScrollTrigger.update);gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0)}
  page.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{
    const t=document.querySelector(a.getAttribute('href'));if(!t)return;e.preventDefault();
    if(lenis)lenis.scrollTo(t,{offset:-20,duration:1.6});else t.scrollIntoView({behavior:'smooth'});
    setTimeout(()=>{const f=document.getElementById('wsp-email');if(f&&t.id==='wsp-form')f.focus({preventScroll:true})},1700);
  }));

  function splitWords(el){if(!el)return[];if(el._w)return el._w;const out=[];
    (function walk(node){[...node.childNodes].forEach(n=>{
      if(n.nodeType===3){const f=document.createDocumentFragment();n.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.append(t);return}
        const m=document.createElement('span');m.className='wm';const i=document.createElement('span');i.textContent=t;m.append(i);f.append(m);out.push(i)});n.replaceWith(f)}
      else if(n.nodeType===1&&n.tagName!=='BR')walk(n)})})(el);return el._w=out}

  /* progress bar */
  const bar=document.createElement('div');bar.className='wsp-progress';bar.setAttribute('aria-hidden','true');document.body.append(bar);
  gsap.to(bar,{scaleX:1,ease:'none',scrollTrigger:{start:0,end:'max',scrub:.3}});

  /* hero intro */
  gsap.timeline()
    .from(splitWords(page.querySelector('.hero h1')),{yPercent:118,rotate:5,duration:1.3,ease:EO,stagger:.07},.1)
    .from('.wsp .hero .eyebrow, .wsp .hero .lede, .wsp .proof',{y:30,opacity:0,duration:1,ease:EO,stagger:.09},.35)
    .fromTo('.wsp .stage',{clipPath:'inset(100% 0% 0% 0% round 32px)'},{clipPath:'inset(0% 0% 0% 0% round 32px)',duration:1.4,ease:'expo.inOut'},0)
    .from('.wsp .form-card',{y:80,rotate:-3,opacity:0,duration:1.3,ease:EO},.6)
    .from('.wsp .form-card > *',{y:20,opacity:0,duration:.8,ease:EO,stagger:.06},.85)
    .from('.wsp .bar .wrap > *',{y:-20,opacity:0,duration:.8,ease:EO,stagger:.08},.1);
  gsap.to('.wsp .hero-copy',{y:70,ease:'none',scrollTrigger:{trigger:'.wsp .hero',start:'top top',end:'bottom top',scrub:true}});

  /* headings, paragraphs */
  page.querySelectorAll('.sec-head h2, .final h2, .about .big').forEach(h=>gsap.from(splitWords(h),{yPercent:118,rotate:4,duration:1.2,ease:EO,stagger:.04,scrollTrigger:{trigger:h,start:'top 86%'}}));
  page.querySelectorAll('.eyebrow').forEach(e=>{if(e.closest('.hero')||e.closest('.cloud'))return;gsap.from(e,{x:-24,opacity:0,duration:1,ease:EO,scrollTrigger:{trigger:e,start:'top 90%'}})});
  gsap.utils.toArray('.wsp .sec-head p, .wsp .about .body p, .wsp .final p').forEach(p=>gsap.from(p,{y:30,opacity:0,duration:1.1,ease:EO,scrollTrigger:{trigger:p,start:'top 90%'}}));

  function batch(sel,from){const els=gsap.utils.toArray(sel);if(!els.length)return;gsap.set(els,from);
    ScrollTrigger.batch(els,{start:'top 90%',once:true,onEnter:b=>gsap.to(b,{x:0,y:0,opacity:1,scale:1,rotate:0,duration:1.1,ease:EO,stagger:.09,overwrite:true})})}
  batch('.wsp .why article',{y:70,opacity:0,rotate:2});
  batch('.wsp .diffs li',{x:40,opacity:0});

  /* 3D cloud */
  (function(){
    const scene=page.querySelector('.cloud-scene');if(!scene)return;
    const words=['Conexão','Cadastro','Campanha','Cupom','Venda','Fidelização','Dados','WhatsApp','SMS','E-mail','Retorno','Permanência','Wi-Fi','Engajamento','Horário de pico','Insight','Cliente','Promoção'];
    let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const W=[];
    words.concat(words).forEach((t,i)=>{const s=document.createElement('span');s.textContent=t;s.className=i%5===0?'b':(i%3===0?'i':'');scene.append(s);
      W.push({el:s,f:18+rnd()*50,x:(rnd()-.5)*1.5,y:(rnd()-.5)*1.25,z:-150-rnd()*2700,ry:(rnd()-.5)*70,rx:(rnd()-.5)*30})});
    function size(){const k=Math.min(1,innerWidth/1300)*.55+.45;W.forEach(w=>w.el.style.fontSize=(w.f*k).toFixed(1)+'px')}
    size();addEventListener('resize',size);
    const center=page.querySelector('.cloud-center'),hint=page.querySelector('.cloud-hint');
    const tt=gsap.timeline({paused:true}).from(center.querySelector('.eyebrow'),{opacity:0,y:20,duration:.4}).from(splitWords(page.querySelector('.cloud-text')),{yPercent:118,rotate:5,duration:1,ease:'power3.out',stagger:.06},.1);
    function render(p){const vw=innerWidth,vh=innerHeight,cam=p*3000;
      scene.style.transform=`rotateX(${14-24*p}deg) rotateZ(${-10+20*p}deg) rotateY(${-22+44*p}deg)`;
      const dim=1-.8*clamp(0,1,(p-.55)/.2);
      W.forEach(w=>{const z=w.z+cam;const o=clamp(0,1,(z+2850)/1300)*clamp(0,1,1-(z-150)/450)*dim;
        w.el.style.opacity=o.toFixed(3);w.el.style.visibility=o<.01?'hidden':'visible';
        w.el.style.transform=`translate(-50%,-50%) translate3d(${(w.x*vw).toFixed(1)}px,${(w.y*vh).toFixed(1)}px,${z.toFixed(1)}px) rotateY(${w.ry}deg) rotateX(${w.rx}deg)`});
      tt.progress(clamp(0,1,(p-.58)/.22));hint.style.opacity=(1-clamp(0,1,p/.12)).toFixed(3)}
    render(0);
    ScrollTrigger.create({trigger:'#wsp-cloud',start:'top top',end:'bottom bottom',onUpdate:s=>render(s.progress),onRefresh:s=>render(s.progress)});
  })();

  /* steps: pinned horizontal on desktop */
  const mm=gsap.matchMedia();
  mm.add('(min-width: 901px)',()=>{
    page.classList.add('hpin');
    const sec=document.getElementById('wsp-how'),track=sec.querySelector('.journey');
    const dist=()=>{const left=track.getBoundingClientRect().left-gsap.getProperty(track,'x');return Math.max(0,track.scrollWidth-(innerWidth-left)+48)};
    const tw=gsap.to(track,{x:()=>-dist(),ease:'none',scrollTrigger:{trigger:sec,start:'top top',end:()=>'+='+(dist()+innerHeight*.4),pin:true,scrub:1,invalidateOnRefresh:true}});
    sec.querySelectorAll('.step').forEach((st,i)=>{
      const trg=i===0?{trigger:sec,start:'top 65%'}:{trigger:st,containerAnimation:tw,start:'left 85%'};
      gsap.from(st.querySelector('.ico'),{rotate:-120,scale:.3,opacity:0,duration:1,ease:'back.out(1.6)',scrollTrigger:trg});
      gsap.from(st.querySelectorAll('h3,p,.n'),{y:30,opacity:0,duration:1,ease:EO,stagger:.07,scrollTrigger:{...trg}});
    });
    return()=>page.classList.remove('hpin');
  });
  mm.add('(max-width: 900px)',()=>{gsap.utils.toArray('.wsp .step').forEach(st=>gsap.from(st,{y:50,opacity:0,duration:1.1,ease:EO,scrollTrigger:{trigger:st,start:'top 88%'}}))});

  /* panels grow into place */
  ['.wsp .final'].forEach(s=>gsap.fromTo(s,{scale:.92,borderRadius:'72px'},{scale:1,borderRadius:'40px',ease:'none',scrollTrigger:{trigger:s,start:'top bottom',end:'top 25%',scrub:true}}));
  gsap.fromTo('.wsp .final .rings',{scale:.6,rotate:0},{scale:1.3,rotate:40,ease:'none',scrollTrigger:{trigger:'.wsp .final',start:'top bottom',end:'bottom top',scrub:true}});

  /* marquee leans with scroll speed */
  const skew=gsap.quickTo('.wsp .marquee span','skewX',{duration:.5,ease:'power3'});
  ScrollTrigger.create({start:0,end:'max',onUpdate:s=>skew(clamp(-14,14,s.getVelocity()/-180))});

  gsap.from('.wsp .foot .wrap > *',{y:24,opacity:0,duration:1,ease:EO,stagger:.1,scrollTrigger:{trigger:'.wsp .foot',start:'top 95%'}});

  /* cursor + magnetic buttons */
  if(fine){
    page.querySelectorAll('.btn').forEach(b=>{const xT=gsap.quickTo(b,'x',{duration:.6,ease:'power3'}),yT=gsap.quickTo(b,'y',{duration:.6,ease:'power3'});
      b.addEventListener('mousemove',e=>{const r=b.getBoundingClientRect();xT((e.clientX-r.left-r.width/2)*.25);yT((e.clientY-r.top-r.height/2)*.4)});
      b.addEventListener('mouseleave',()=>{xT(0);yT(0)})});
    const c=document.createElement('div');c.className='wsp-cursor';c.setAttribute('aria-hidden','true');c.innerHTML='<span></span>';document.body.append(c);
    const lab=c.firstChild,xs=gsap.quickTo(c,'x',{duration:.35,ease:'power3'}),ys=gsap.quickTo(c,'y',{duration:.35,ease:'power3'});
    addEventListener('mousemove',e=>{xs(e.clientX);ys(e.clientY)});
    document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-cursor]');
      if(t&&!e.target.closest('form')){lab.textContent=t.dataset.cursor;c.classList.add('big')}else c.classList.remove('big');
      c.classList.toggle('hide',!!e.target.closest('.btn, input, select, form'))});
    document.addEventListener('mouseleave',()=>c.classList.add('hide'));
  }

  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>ScrollTrigger.refresh());
  addEventListener('load',()=>ScrollTrigger.refresh());
})();
</script>
